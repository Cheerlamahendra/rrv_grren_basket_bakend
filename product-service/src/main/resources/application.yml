
server:
  port: 8084

spring:
  application:
    name: product-service

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:mysql://localhost:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    ip-address: 192.168.0.107
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    issuer: rrv-gateway

  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0}
    internal-service-id: product-service
    authorized-internal-services: api-gateway,auth-service,order-service,inventory-service

  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}

  s3:
    deletion-outbox:
      enabled: ${S3_DELETION_OUTBOX_ENABLED:true}
      poll-interval-ms: ${S3_DELETION_OUTBOX_POLL_INTERVAL_MS:5000}
      batch-size: ${S3_DELETION_OUTBOX_BATCH_SIZE:50}

# AWS S3 Image Storage
aws:
  s3:
    provider: aws-s3
    region: ${AWS_REGION:ap-southeast-2}
    bucket-name: ${AWS_S3_BUCKET}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN}
    max-file-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
