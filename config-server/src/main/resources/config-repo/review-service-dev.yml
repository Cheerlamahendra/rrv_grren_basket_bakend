# ==============================================================================
# Review Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/review_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

review:
  validation:
    max-bulk-size: 50
  product-service:
    url: http://PRODUCT-SERVICE
    timeout-ms: 3000
    mock-fallback-enabled: ${PRODUCT_SERVICE_MOCK_FALLBACK:true}
