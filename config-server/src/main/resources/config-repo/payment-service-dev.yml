# ==============================================================================
# Payment Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Razorpay Payment Gateway Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret_key_not_real}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret_not_real}
  currency: INR
  enabled: ${RAZORPAY_ENABLED:true}

# Payment Business Rules (Configurable Partial COD)
payment:
  partial-cod:
    enabled: true
    advance-percentage: 50
    delivery-collection-percentage: 50
    currency: INR
  outbox:
    batch-size: 50
    max-retries: 5
    poll-interval-ms: 5000
  reconciliation:
    pending-threshold-minutes: 15
    poll-interval-ms: 60000
