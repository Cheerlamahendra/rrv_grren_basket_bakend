server:
  port: 8086

spring:
  datasource:
    url: ${CART_DB_URL:jdbc:mysql://localhost:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  services:
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}

  jwt:
    issuer: rrv-gateway

  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET}
    gateway-audience: rrv-internal-services
