# ==============================================================================
# Auth Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Security, JWT & OTP Token Controls
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 1800000 # 30 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    issuer: rrv-green-basket-auth
  otp:
    expiration-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
  security:
    admin-max-failed-attempts: 5
    admin-lockout-duration-minutes: 15
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0}
    internal-service-id: auth-service
    authorized-internal-services: api-gateway,customer-service,order-service
    test-admin:
      email: testadmin@rrvgreenbasket.com
      password: TestAdmin@123
  services:
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
