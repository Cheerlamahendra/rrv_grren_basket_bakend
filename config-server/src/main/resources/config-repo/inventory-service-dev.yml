# ==============================================================================
# Inventory Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  inventory:
    reservation-expiry-minutes: 15
    outbox-batch-size: 50
    outbox-max-retries: 5
