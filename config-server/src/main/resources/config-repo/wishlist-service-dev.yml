# ==============================================================================
# Wishlist Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Wishlist Service Properties
wishlist:
  validation:
    max-bulk-size: 50
  product-service:
    url: http://PRODUCT-SERVICE
    timeout-ms: 3000

app:
  jwt:
    issuer: rrv-gateway
  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:RQpmB5hGO2NsLNE7OnwXo5NfNtEJj+j+461g0oEeGunJPZ4iYQEGr+uk5M3hAfgDg26IDtmA9N2RJbFXkCLrqQ==}
    internal-service-id: wishlist-service
    gateway-audience: rrv-internal-services

