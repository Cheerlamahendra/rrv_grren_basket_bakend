# ==============================================================================
# Wishlist Service — Development Profile Configuration
# ==============================================================================

server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Wishlist Service Properties
wishlist:
  validation:
    max-bulk-size: 50
  product-service:
    url: http://PRODUCT-SERVICE
    timeout-ms: 3000
