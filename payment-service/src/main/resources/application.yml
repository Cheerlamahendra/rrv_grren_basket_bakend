server:
  port: 8089

spring:
  application:
    name: payment-service

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    issuer: rrv-gateway

  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0}
    internal-service-id: payment-service
    authorized-internal-services: api-gateway,auth-service,order-service,delivery-service,customer-service

  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8088}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret_key_not_real}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret_not_real}
  currency: INR
  enabled: ${RAZORPAY_ENABLED:true}

payment:
  partial-cod:
    enabled: true
    advance-percentage: 50
    delivery-collection-percentage: 50
    currency: INR
  outbox:
    batch-size: 50
    max-retries: 5
    poll-interval-ms: 5000
  reconciliation:
    pending-threshold-minutes: 15
    poll-interval-ms: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
