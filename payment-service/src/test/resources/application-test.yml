server:
  port: 0

spring:
  application:
    name: payment-service
  config:
    import: ""
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:payment_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    issuer: rrv-gateway
  security:
    internal-service-secret: c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0
    internal-service-id: payment-service
    authorized-internal-services: api-gateway,auth-service,order-service,delivery-service,customer-service
  services:
    auth-service-url: http://localhost:8081
    order-service-url: http://localhost:8088

razorpay:
  key-id: rzp_test_mock_key_id_123
  key-secret: mock_secret_key_for_testing_123456
  webhook-secret: mock_webhook_secret_for_testing_123456
  currency: INR
  enabled: true

payment:
  partial-cod:
    enabled: true
    advance-percentage: 50
    delivery-collection-percentage: 50
    currency: INR
  outbox:
    batch-size: 50
    max-retries: 5
    poll-interval-ms: 3600000
  reconciliation:
    pending-threshold-minutes: 15
    poll-interval-ms: 3600000
