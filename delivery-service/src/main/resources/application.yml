# ==============================================================================
# Delivery Service Local Fallback Configuration
# ==============================================================================

server:
  port: ${PORT:8094}

spring:
  application:
    name: delivery-service
  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false

  datasource:
    url: ${DELIVERY_DB_URL:jdbc:mysql://localhost:3306/delivery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    issuer: rrv-gateway
  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:RQpmB5hGO2NsLNE7OnwXo5NfNtEJj+j+461g0oEeGunJPZ4iYQEGr+uk5M3hAfgDg26IDtmA9N2RJbFXkCLrqQ==}
    internal-service-id: delivery-service
    gateway-audience: rrv-internal-services

google:
  maps:
    server-api-key: ${GOOGLE_MAPS_SERVER_KEY}
    browser-api-key: ${GOOGLE_MAPS_BROWSER_KEY}
    places-enabled: ${GOOGLE_PLACES_ENABLED:true}
    geocoding-enabled: ${GOOGLE_GEOCODING_ENABLED:true}
    routes-enabled: ${GOOGLE_ROUTES_ENABLED:true}
    connect-timeout-ms: ${GOOGLE_MAPS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GOOGLE_MAPS_READ_TIMEOUT_MS:10000}

delivery:
  default-currency: ${DELIVERY_DEFAULT_CURRENCY:INR}
  default-country: ${DELIVERY_DEFAULT_COUNTRY:India}
  default-country-code: ${DELIVERY_DEFAULT_COUNTRY_CODE:IN}
  default-maximum-distance-meters: ${DELIVERY_DEFAULT_MAX_DISTANCE_METERS:5000}
