server:
  port: 0

spring:
  application:
    name: cart-service
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:cart_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

cart:
  expiration:
    duration-days: 7
    cleanup-interval-ms: 3600000
    batch-size: 100

app:
  services:
    auth-service-url: http://localhost:8081
    product-service-url: http://localhost:8084
    inventory-service-url: http://localhost:8085

  client:
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

  jwt:
    issuer: rrv-gateway

  security:
    internal-service-id: cart-service
    internal-service-secret: c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0
    gateway-audience: rrv-internal-services
