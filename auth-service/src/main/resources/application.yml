
server:
  port: 8081

spring:
  application:
    name: auth-service

  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    config:
      fail-fast: false

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver
  #spring:
    #datasource:
      #url: jdbc:mysql://${DB_HOST:rrv-basket-db.c3a6eqkeep7i.ap-southeast-2.rds.amazonaws.com}:${DB_PORT:3306}/auth_db?useSSL=true&serverTimezone=UTC
      #username: ${MYSQL_USER:admin}
      #password: ${MYSQL_PASSWORD:rrv_basket_2026}
      #driver-class-name: com.mysql.cj.jdbc.Driver

    #jpa:
      #hibernate:
        #ddl-auto: validate
      #show-sql: false

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
    issuer: rrv-green-basket-auth

  otp:
    expiration-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60

  security:
    admin-max-failed-attempts: 5
    admin-lockout-duration-minutes: 15
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:}
    internal-service-id: auth-service
    authorized-internal-services: api-gateway,customer-service,order-service,product-service

    test-admin:
      email: testadmin@rrvgreenbasket.com
      password: ${TEST_ADMIN_PASSWORD:TestAdmin@123}

  services:
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}

  email:
    provider: resend
    api-url: https://api.resend.com/emails
    api-key: ${RESEND_API_KEY}
    from-email: "RRV Green Basket <onboarding@resend.dev>"

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method