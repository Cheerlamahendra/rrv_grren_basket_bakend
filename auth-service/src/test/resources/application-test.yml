server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 604800000
    issuer: rrv-green-basket-auth
  otp:
    expiration-minutes: 5
    max-attempts: 3
    resend-cooldown-seconds: 60
  security:
    admin-max-failed-attempts: 5
    admin-lockout-duration-minutes: 15
    internal-service-secret: c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0
    internal-service-id: auth-service
    authorized-internal-services: api-gateway,customer-service,order-service
    test-admin:
      email: testadmin@rrvgreenbasket.com
      password: TestAdmin@123
  services:
    customer-service-url: http://localhost:8082
  email:
    provider: mock
