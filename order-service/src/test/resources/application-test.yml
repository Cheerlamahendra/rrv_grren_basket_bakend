server:
  port: 0

spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:order_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    issuer: rrv-gateway
  security:
    internal-service-secret: RQpmB5hGO2NsLNE7OnwXo5NfNtEJj+j+461g0oEeGunJPZ4iYQEGr+uk5M3hAfgDg26IDtmA9N2RJbFXkCLrqQ==
    internal-service-id: order-service
    gateway-audience: rrv-internal-services
  services:
    cart-service-url: http://localhost:8086
    product-service-url: http://localhost:8084
    delivery-service-url: http://localhost:8094
    customer-service-url: http://localhost:8082
  client:
    connect-timeout-ms: 1000
    read-timeout-ms: 1000
