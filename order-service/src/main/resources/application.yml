# ==============================================================================
# Order Service Local Fallback Configuration
# ==============================================================================

server:
  port: 8091

spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:mahendra}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    issuer: rrv-gateway
  security:
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:c8f7e2d1a5b49382716054321fedcba9876543210abcdef0123456789abcdef0}
    internal-service-id: order-service
    gateway-audience: rrv-internal-services
  services:
    cart-service-url: ${CART_SERVICE_URL:http://localhost:8086}
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8084}
    inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
    delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8094}
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
  client:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
